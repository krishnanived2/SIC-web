<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Events | Medium Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* ===== GLOBAL RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1c1c3c);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            padding: 60px 20px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== SECTION ===== */
        .events-section {
            max-width: 1050px; /* "Medium" container width */
            margin: 0 auto;
            text-align: center;
            color: white;
        }

        .events-section h1 {
            font-size: 32px;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .events-section h1 span {
            color: #8a7dff;
            border-bottom: 3px solid #8a7dff;
            padding-bottom: 5px;
        }

        /* ===== GRID ===== */
        .events-container {
            display: grid;
            /* Creates 3 columns on desktop, 2 on tablet, 1 on mobile */
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            justify-items: center;
        }

        /* ===== GLASS CARD ===== */
        .event-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 320px; /* Keeps cards from getting too large */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .event-card:hover {
            transform: translateY(-10px);
            border: 1px solid rgba(138, 125, 255, 0.5);
            box-shadow: 0 15px 35px rgba(138, 125, 255, 0.2);
        }

        /* ===== IMAGE BOX (The "Correct" Way) ===== */
        .image-box {
            width: 100%;
            height: 200px; /* Fixed height for all images */
            overflow: hidden;
            background: #000;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Crops image to fill box without distortion */
            object-position: center;
            transition: transform 0.5s ease;
        }

        .event-card:hover .image-box img {
            transform: scale(1.1); /* Subtle zoom effect */
        }

        /* ===== CONTENT ===== */
        .event-content {
            padding: 22px;
            text-align: left;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .event-content h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #fff;
            font-weight: 600;
        }

        .event-content p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== BUTTON ===== */
        .btn {
            display: block;
            margin-top: auto; /* Pushes button to bottom of card */
            padding: 12px;
            background: linear-gradient(135deg, #7b6cff, #5a8cff);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 5px 15px rgba(90, 140, 255, 0.4);
        }

        /* ===== RESPONSIVE ADJUSTMENTS ===== */
        @media (max-width: 768px) {
            .events-section h1 { font-size: 28px; }
            .events-container { gap: 20px; }
            body { padding: 40px 15px; }
        }
    </style>
</head>

<body>

<section class="events-section">
    <h1>Past <span>Events</span></h1>

    <div class="events-container">

        <div class="event-card">
            <div class="image-box">
                <img src="https://raw.githubusercontent.com/krishnanived2/SIC-web/refs/heads/main/p11%20(1).png" alt="Sprint & Solve">
            </div>
            <div class="event-content">
                <h2>Sprint & Solve</h2>
                <p><span>📅</span> 27-08-2025</p>
                <p><span>⏰</span> 11:15 AM</p>
                <a href="d.html" class="btn">About the event</a>
            </div>
        </div>

        <div class="event-card">
            <div class="image-box">
                <img src="https://raw.githubusercontent.com/krishnanived2/SIC-web/refs/heads/main/p15.jpeg" alt="Mind Spark">
            </div>
            <div class="event-content">
                <h2>Mind Spark</h2>
                <p><span>📅</span> 28-02-2025</p>
                <p><span>⏰</span> 1:15 PM - 3:15 PM</p>
                <a href="c.html" class="btn">About the event</a>
            </div>
        </div>

        <div class="event-card">
            <div class="image-box">
                <img src="https://raw.githubusercontent.com/krishnanived2/SIC-web/refs/heads/main/p14.jpeg" alt="Treasure Hunt">
            </div>
            <div class="event-content">
                <h2>Treasure Hunt</h2>
                <p><span>📅</span> 08-04-2025</p>
                <p><span>⏰</span> 11:00 AM</p>
                <a href="b.html" class="btn">About the event</a>
            </div>
        </div>

        <div class="event-card">
            <div class="image-box">
                <img src="https://raw.githubusercontent.com/krishnanived2/SIC-web/refs/heads/main/p16.jpg" alt="Synergy Sprint">
            </div>
            <div class="event-content">
                <h2>Synergy Sprint</h2>
                <p><span>📅</span> 23-01-2026</p>
                <p><span>⏰</span> 11:15 AM - 12:15 PM</p>
                <a href="a.html" class="btn">About the event</a>
            </div>
        </div>

    </div>
</section>

</body>
</html>
