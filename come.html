<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcoming Events</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c1c3c);
  background-size:400% 400%;
  animation: gradientMove 15s ease infinite;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ===== BACK BUTTON CONTAINER ===== */
.back-container {
  width: 100%;
  max-width: 1200px;
  display: flex;
  justify-content: flex-start;
  margin-bottom: 10px;
}

.back-btn {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 10px 20px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: 0.3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.back-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: translateX(-5px);
  border-color: #8a7dff;
}

/* ===== SECTION ===== */
.events-section{
  padding:20px 10px 60px 10px;
  max-width:1200px;
  width:100%;
  text-align:center;
  color:white;
}

.events-section h1{
  font-size:38px;
  margin-bottom:40px;
  background:linear-gradient(90deg,#ffffff,#8a7dff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  display: inline-block;
}

.events-section h1 span{
  border-bottom:3px solid #8a7dff;
  -webkit-text-fill-color: white; /* Ensures span text is visible if needed */
}

/* ===== GRID ===== */
.events-container{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
  gap:25px;
}

/* ===== GLASS CARD ===== */
.event-card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:20px;
  overflow:hidden;
  transition:0.4s ease;
  display:flex;
  flex-direction:column;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

.event-card:hover{
  transform:translateY(-8px);
  box-shadow:0 0 25px rgba(138,125,255,0.6);
}

/* ===== IMAGE ===== */
.event-card img{
  width:100%;
  height:auto;              /* Shows full image */
  max-height:260px;         /* Prevents too tall images */
  object-fit:contain;       /* Keeps full image visible */
  background:#111;          /* Clean background if ratio differs */
  padding:10px;
}

/* ===== CONTENT ===== */
.event-content{
  padding:20px;
  text-align:left;
  flex:1;
  display:flex;
  flex-direction:column;
  color:white;
}

.event-content h2{
  font-size:20px;
  margin-bottom:10px;
}

.event-content p{
  font-size:14px;
  opacity:0.85;
  margin-bottom:6px;
}

/* ===== BUTTON ===== */
.event-content button{
  margin-top:auto;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#8a7dff,#6c63ff);
  color:white;
  cursor:pointer;
  font-size:14px;
  transition:0.3s ease;
  box-shadow:0 0 15px rgba(138,125,255,0.5);
}

.event-content button:hover{
  transform:translateY(-3px);
  box-shadow:0 0 25px rgba(138,125,255,0.9);
}

/* ===== RESPONSIVE ===== */
@media (max-width:768px){
  .events-section h1{
    font-size:26px;
  }
  .event-content{
    padding:18px;
  }
  .event-content h2{
    font-size:18px;
  }
}

</style>
</head>

<body>

<div class="back-container">
    <button class="back-btn" onclick="history.back()">
        <i class="fas fa-arrow-left"></i> Back
    </button>
</div>

<section class="events-section">
  <h1><span>Upcoming</span> Events</h1>

  <div class="events-container">
    <div class="event-card">
      <img src="https://raw.githubusercontent.com/krishnanived2/SIC-web/refs/heads/main/p16.png" alt="Code Conquest">
      <div class="event-content">
        <h2>Code Conquest</h2>
        <p>📅 Coming Soon</p>
        <p>⏰ Coming Soon</p>
        <button>About the event</button>
      </div>
    </div>
  </div>
</section>

</body>
</html>
