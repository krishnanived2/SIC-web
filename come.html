<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upcoming Events</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

/* =====================================================
   GLOBAL RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


/* =====================================================
   BODY
===================================================== */

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    color:white;
    background:#0a0a0f;
    overflow-x:hidden;
}


/* =====================================================
   MOVING BACKGROUND
===================================================== */

.moving-background{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    overflow:hidden;
    z-index:-10;
}


/* =====================================================
   BACKGROUND TRACK
===================================================== */

.background-track{
    position:absolute;
    top:0;
    left:0;

    width:200%;
    height:100%;

    display:flex;

    animation:
        backgroundSlide
        15s
        linear
        infinite;
}


/* =====================================================
   BACKGROUND IMAGE
===================================================== */

.background-image{
    width:50%;
    height:100%;

    flex-shrink:0;

    background-image:
        linear-gradient(
            to bottom,
            rgba(10,10,15,0.65),
            rgba(20,20,30,0.90)
        ),
        url("https://images.unsplash.com/photo-1608403890696-0f18a2960153?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
}


/* =====================================================
   LEFT → RIGHT MOVEMENT
===================================================== */

@keyframes backgroundSlide{

    0%{
        transform:translateX(-50%);
    }

    100%{
        transform:translateX(0%);
    }

}


/* =====================================================
   EXTRA DARK OVERLAY
===================================================== */

.moving-background::after{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.08);

    pointer-events:none;
}


/* =====================================================
   BACK BUTTON CONTAINER
===================================================== */

.back-container{

    width:100%;
    max-width:1200px;

    display:flex;
    justify-content:flex-start;

    margin:0 auto;

    padding:25px 20px 10px;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn{

    background:rgba(255,255,255,0.10);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.20);

    color:white;

    padding:10px 20px;

    border-radius:30px;

    cursor:pointer;

    font-size:14px;

    font-weight:600;

    display:flex;
    align-items:center;

    gap:10px;

    transition:0.3s ease;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.2);
}


.back-btn:hover{

    background:rgba(255,255,255,0.20);

    transform:translateX(-5px);

    border-color:#8a7dff;

    box-shadow:
        0 0 15px rgba(138,125,255,0.5);
}


/* =====================================================
   EVENTS SECTION
===================================================== */

.events-section{

    width:100%;
    max-width:1200px;

    margin:0 auto;

    padding:
        30px 20px 70px;

    text-align:center;

    color:white;
}


/* =====================================================
   MAIN TITLE
===================================================== */

.events-section h1{

    font-size:38px;

    margin-bottom:40px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #8a7dff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    display:inline-block;
}


.events-section h1 span{

    border-bottom:
        3px solid #8a7dff;

    -webkit-text-fill-color:white;
}


/* =====================================================
   GRID
===================================================== */

.events-container{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px,1fr)
        );

    gap:25px;

    justify-content:center;
}


/* =====================================================
   GLASS EVENT CARD
===================================================== */

.event-card{

    background:
        rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:
        1px solid rgba(255,255,255,0.15);

    border-radius:20px;

    overflow:hidden;

    transition:
        transform 0.4s ease,
        box-shadow 0.4s ease,
        border-color 0.4s ease;

    display:flex;

    flex-direction:column;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.35);
}


.event-card:hover{

    transform:
        translateY(-8px);

    box-shadow:
        0 0 25px
        rgba(138,125,255,0.6);

    border-color:
        rgba(138,125,255,0.6);
}


/* =====================================================
   EVENT IMAGE
===================================================== */

.event-card img{

    width:100%;

    height:260px;

    object-fit:contain;

    background:
        rgba(0,0,0,0.35);

    padding:10px;

    display:block;
}


/* =====================================================
   EVENT CONTENT
===================================================== */

.event-content{

    padding:20px;

    text-align:left;

    flex:1;

    display:flex;

    flex-direction:column;

    color:white;
}


.event-content h2{

    font-size:20px;

    margin-bottom:10px;
}


.event-content p{

    font-size:14px;

    opacity:0.85;

    margin-bottom:6px;
}


/* =====================================================
   ABOUT EVENT BUTTON
===================================================== */

.event-content button{

    margin-top:auto;

    padding:12px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #8a7dff,
            #6c63ff
        );

    color:white;

    cursor:pointer;

    font-size:14px;

    font-weight:600;

    transition:0.3s ease;

    box-shadow:
        0 0 15px
        rgba(138,125,255,0.5);
}


.event-content button:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 0 25px
        rgba(138,125,255,0.9);
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width:992px){

    .events-section{

        padding-left:25px;
        padding-right:25px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:768px){

    .moving-background{

        width:100%;
        height:100vh;

    }


    .background-track{

        width:200%;
        height:100%;

        animation:
            backgroundSlide
            15s
            linear
            infinite;
    }


    .background-image{

        width:50%;
        height:100%;

        background-size:cover;

        background-position:center center;

    }


    .back-container{

        padding:
            20px 15px 5px;
    }


    .back-btn{

        padding:
            8px 16px;

        font-size:13px;

    }


    .events-section{

        padding:
            25px 15px 60px;
    }


    .events-section h1{

        font-size:28px;

        margin-bottom:35px;
    }


    .events-container{

        grid-template-columns:1fr;

        gap:22px;
    }


    .event-card{

        width:100%;

        max-width:420px;

        margin:0 auto;
    }


    .event-card img{

        height:auto;

        max-height:260px;

        object-fit:contain;
    }


    .event-content{

        padding:18px;
    }


    .event-content h2{

        font-size:18px;
    }


    .event-content p{

        font-size:13px;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width:400px){

    .events-section{

        padding-left:10px;
        padding-right:10px;
    }


    .events-section h1{

        font-size:25px;
    }


    .event-card img{

        max-height:230px;
    }


    .back-btn{

        font-size:12px;

        padding:
            7px 14px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     MOVING BACKGROUND
===================================================== -->

<div class="moving-background">

<div class="background-track">

    <!-- First image -->
    <div class="background-image"></div>

    <!-- Duplicate image for seamless movement -->
    <div class="background-image"></div>

</div>

</div>

<!-- =====================================================
     BACK BUTTON
===================================================== -->

<div class="back-container">


<button
    class="back-btn"
    onclick="history.back()">

    <i class="fas fa-arrow-left"></i>

    Back

</button>


</div>

<!-- =====================================================
     UPCOMING EVENTS
===================================================== -->

<section class="events-section">


<h1>
    <span>Upcoming</span> Events
</h1>


<div class="events-container">


    <!-- =================================================
         EVENT CARD
    ================================================== -->

    <div class="event-card">


        <!-- EVENT IMAGE -->

        <img
            src="https://raw.githubusercontent.com/krishnanived2/SIC-web/refs/heads/main/p16.png"
            alt="Code Conquest">


        <!-- EVENT CONTENT -->

        <div class="event-content">

            <h2>
                Code Conquest
            </h2>


            <p>
                📅 Coming Soon
            </p>


            <p>
                ⏰ Coming Soon
            </p>


            <button>
                About the event
            </button>

        </div>

    </div>


</div>


</section>

</body>
</html>
